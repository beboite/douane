# douane, broker configuration.
#
# Nothing here is a secret. Every credential is a reference into the vault, so
# this file is safe to read, diff and commit. Keep it that way: the day a real
# key can live in here is the day one does.
#
# Copy to douane.toml, adjust, then:
#   douanectl init
#   douanectl put anthropic.api_key
#   douane --check

[server]
# Loopback by default. Moving this to a LAN address is a decision to type out,
# never one to inherit.
listen = "127.0.0.1:8787"
database = "douane.sqlite"

# ---------------------------------------------------------------- providers --
# `trust` is not about model quality. It is about who reads the conversation
# afterwards.

# Nothing leaves the LAN. The only upstream that gets the real context.
[providers.local]
base_url = "http://10.0.0.10:8080"
trust = "max"

# A vendor with a contract and a reputation to lose.
[providers.anthropic]
base_url = "https://api.anthropic.com"
key = { namespace = "anthropic", key = "api_key" }
trust = "mid"

# A reseller. Assume every byte sent is stored and read. DeepSeek ships an
# Anthropic-compatible endpoint, so no protocol translation is needed, but the
# compatibility shim ignores cache_control: expect no cache discount and count
# the tokens here rather than trusting the invoice.
[providers.deepseek]
base_url = "https://api.deepseek.com/anthropic"
key = { namespace = "deepseek", key = "api_key" }
trust = "low"

# ------------------------------------------------------------------- routes --
# The indirection is the feature. Claude Code only ever emits three model tiers,
# so this table is how a cheap upstream gets to serve subagents without the
# agent knowing or caring. Change it here, no session restart.

[routes.opus]
provider = "anthropic"
model = "claude-opus-5"

[routes.sonnet]
provider = "anthropic"
model = "claude-sonnet-5"

# Every subagent declared `model: haiku` lands on DeepSeek.
[routes.haiku]
provider = "deepseek"
model = "deepseek-chat"
fallback = ["sonnet"]

[routes.qwopus]
provider = "local"

# ------------------------------------------------------------------ clients --
# One virtual key per machine, per project or per agent profile. Revoke and
# budget on this axis.

[clients.workstation]
key = { namespace = "douane", key = "vk_workstation" }
note = "the dev machine, everything allowed"

# A profile that physically cannot reach a reseller, whatever the routing table
# says. For work on anything that must not leave the house.
[clients.sensitive]
key = { namespace = "douane", key = "vk_sensitive" }
max_trust = "max"
note = "local model only, no exception"

[clients.autonomous]
key = { namespace = "douane", key = "vk_autonomous" }
routes = ["haiku", "sonnet"]
note = "unattended agents, cheap tiers only"
