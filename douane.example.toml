[server]
listen = "127.0.0.1:8787"
# client_api_base_url = "http://127.0.0.1:8787/v1"
auth_dir = "auth"
database = "douane.sqlite"
# management_token_env = "DOUANE_MANAGEMENT_TOKEN"

[settings]
strategy = "smart"
quota_refresh_seconds = 300
# Longest wait for the upstream to answer, then for each next piece of its stream.
# A long answer keeps streaming as long as the upstream stays active.
request_timeout_seconds = 180
# default_provider = "codex"
# Hours before an account's weekly reset when its reserve and client shares stop
# applying, so what is left gets used. 0 keeps them to the end.
free_before_reset_hours = 6

[settings.provider_strategies]
# claude = "reset-first"
# codex = "smart"

# How /v1/quotas presents each provider: "accounts" (default) or "average".
[settings.quota_display]
# antigravity = "average"

# Which windows /v1/quotas sends per provider, and which one leads.
[settings.quota_windows]
# claude = { hidden = ["seven-day-opus"], primary = "five-hour" }

