[package]
name = "douanectl"
description = "Command line for the douane vault and broker. The only tool that ever handles a credential value."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
douane-vault.workspace = true
# For `ca init`. Its own crate rather than the broker's, so minting a
# certificate does not drag axum, rusqlite and reqwest into this binary, while
# both still agree on what a valid authority is.
douane-ca.workspace = true

anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true

rpassword = "7"
# For `use`, the grant redemption call. Synchronous and small on purpose: this
# binary talks to one broker on the LAN and has no business carrying tokio.
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"
